<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeFrutos — Escuela de Judo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Italiana&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050505;
  --text:#f2f2f2;
  --muted:rgba(255,255,255,.62);
  --line:rgba(255,255,255,.14);
  --pad:clamp(20px,3vw,48px);
  /* NB: the brief's cubic-bezier(2,.8,2,1) is invalid CSS (x must be 0..1) and would be dropped by the browser;
     this is the nearest valid expo-out curve. */
  --ease:cubic-bezier(.2,.8,.2,1);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --serif:"Italiana",Georgia,serif;
}
*{box-sizing:border-box}
html{background:var(--bg);scrollbar-gutter:stable}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
ul{list-style:none;margin:0;padding:0}
h1,p{margin:0}

/* ---------- Loader ---------- */
.loader{
  position:fixed;inset:0;z-index:100;background:#000;
  display:flex;align-items:center;justify-content:center;
  font:500 12px/1 var(--mono);letter-spacing:.2em;color:var(--muted);
  transition:opacity .6s ease,visibility .6s;
}
.loader.done{opacity:0;visibility:hidden;pointer-events:none}

/* ---------- Hero ---------- */
.hero{position:relative;height:520vh}
.sticky{
  position:sticky;top:0;height:100svh;overflow:hidden;
  isolation:isolate;background:var(--bg);
}
#cv{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block}
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(90deg,rgba(0,0,0,.5),transparent 35%,transparent 70%,rgba(0,0,0,.35)),
    linear-gradient(180deg,rgba(0,0,0,.3),transparent 30%,transparent 75%,rgba(0,0,0,.5)),
    linear-gradient(rgba(0,0,0,.18),rgba(0,0,0,.18));
}

/* ---------- Buttons ---------- */
.btn{
  position:relative;overflow:hidden;isolation:isolate;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:44px;padding:0 20px;border-radius:2px;
  font:500 14px/1 var(--sans);white-space:nowrap;cursor:pointer;
  border:1px solid transparent;
  transition:color .45s var(--ease);
}
.btn::before{
  content:"";position:absolute;inset:0;z-index:-1;
  transform:scaleY(0);transform-origin:bottom;
  transition:transform .45s var(--ease);
}
.btn:hover::before,.btn:focus-visible::before{transform:scaleY(1)}
.btn-light{background:#fff;color:#0a0a0a}
.btn-light::before{background:#000}
.btn-light:hover,.btn-light:focus-visible{color:#fff}
.btn-sm{height:34px;padding:0 14px;font-size:13px}
.btn .arrow{display:inline-block;transition:transform .3s var(--ease)}
.btn:hover .arrow{transform:translateX(3px)}

/* ---------- UI layers ---------- */
.ui{transition:opacity .25s linear}
.hero:not([data-state="start"]) .ui{opacity:0;pointer-events:none}

.mono{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-shadow:0 1px 14px rgba(0,0,0,.55)}

.tl{position:absolute;z-index:3;left:var(--pad);top:var(--pad)}
.tl li{color:#fff}
.tl li + li{margin-top:6px}
.tl li span{color:var(--muted);margin-right:.5em}

.bl{position:absolute;z-index:3;left:var(--pad);bottom:var(--pad)}
.chip{
  display:inline-block;background:#fff;color:#000;padding:7px 10px;
  font:400 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;
  margin-bottom:18px;
}
.headline{
  font:600 clamp(48px,7.2vw,116px)/.95 var(--sans);
  letter-spacing:-.045em;color:#fff;
  text-shadow:0 2px 30px rgba(0,0,0,.45);
}
.headline .w{
  display:inline-block;overflow:hidden;
  padding-bottom:.18em;margin-bottom:-.18em;
  padding-right:.06em;margin-right:-.06em;
  vertical-align:top;
}
.headline .w > span{
  display:inline-block;transform:translateY(110%);
  transition:transform 1s var(--ease);
  transition-delay:calc(var(--i) * 80ms);
}
html.ready .headline .w > span{transform:translateY(0)}

.card{
  position:absolute;z-index:3;right:var(--pad);bottom:var(--pad);
  width:min(340px,42vw);padding:12px;border-radius:6px;
  display:flex;gap:12px;
  background:rgba(255,255,255,.08);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);
}
.card img{width:84px;height:104px;flex:none;object-fit:cover;object-position:50% 20%;border-radius:3px;display:block}
.card-body{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
.card-title{font:500 16px/1.25 var(--sans)}
.card-cap{margin-top:6px;color:var(--muted)}
.card .btn{margin-top:auto}

.scroll-hint{
  position:absolute;z-index:3;left:50%;bottom:var(--pad);transform:translateX(-50%);
  display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--muted);
}
.scroll-hint i{position:relative;display:block;width:1px;height:28px;background:rgba(255,255,255,.18);overflow:hidden}
.scroll-hint i::after{
  content:"";position:absolute;inset:0;background:#fff;
  transform:scaleY(0);transform-origin:top;
  animation:drip 1.6s ease-in-out infinite;
}
@keyframes drip{
  0%{transform:scaleY(0);transform-origin:top}
  50%{transform:scaleY(1);transform-origin:top}
  50.01%{transform:scaleY(1);transform-origin:bottom}
  100%{transform:scaleY(0);transform-origin:bottom}
}

/* ---------- Finale ---------- */
.finale{
  position:absolute;z-index:4;left:0;right:0;bottom:var(--pad);
  display:flex;flex-direction:column;align-items:center;gap:16px;
  padding:0 var(--pad);text-align:center;
  opacity:0;transform:translateY(20px);pointer-events:none;
  transition:opacity .5s ease,transform .5s ease;
}
.finale p{font:500 clamp(16px,1.6vw,22px)/1.3 var(--sans);text-shadow:0 1px 18px rgba(0,0,0,.7)}
.hero[data-state="finale"] .finale{opacity:1;transform:none;pointer-events:auto}

/* ---------- Mobile ---------- */
@media (max-width:820px){
  .scroll-hint{display:none}
  .headline{font-size:clamp(40px,12vw,64px)}
  .bl{bottom:calc(var(--pad) + 128px + 20px);right:var(--pad)}
  .card{left:var(--pad);width:auto}
  .card-title{font-size:15px}
}
@media (prefers-reduced-motion:reduce){
  .scroll-hint i::after{animation:none}
}
</style>
</head>
<body>

<div class="loader" id="loader">LOADING DEFRUTOS</div>

<header class="hero" id="hero" data-state="start">
  <div class="sticky">
    <canvas id="cv"></canvas>
    <div class="vignette"></div>

    <!-- Top-left list -->
    <ul class="tl ui mono">
      <li><span>/</span>Alicante</li>
      <li><span>/</span>Elite Judo</li>
      <li><span>/</span>Mastery</li>
      <li><span>/</span>DeFrutos</li>
    </ul>

    <!-- Bottom-left: chip + headline -->
    <div class="bl ui">
      <span class="chip">DeFrutos — Escuela de Judo</span>
      <h1 class="headline">
        <span class="w" style="--i:0"><span>El</span></span>
        <span class="w" style="--i:1"><span>Arte</span></span><br>
        <span class="w" style="--i:2"><span>del</span></span>
        <span class="w" style="--i:3"><span>Judo.</span></span>
      </h1>
    </div>

    <!-- Bottom-right: glass card -->
    <div class="card ui">
      <img src="https://rustams060575-bot.github.io/de-frutos-judo/frames/f_236.jpg" alt="" width="84" height="104">
      <div class="card-body">
        <div class="card-title">Filosofía DeFrutos</div>
        <div class="card-cap mono">Alicante — España</div>
        <a class="btn btn-light btn-sm" href="#hero">Ver escuela <span class="arrow">→</span></a>
      </div>
    </div>

    <!-- Bottom-center: scroll hint -->
    <div class="scroll-hint ui mono"><span>Scroll</span><i></i></div>

    <!-- Finale -->
    <div class="finale">
      <p>Reserva tu primera sesión</p>
      <a class="btn btn-light" href="#hero">Agendar clase</a>
    </div>
  </div>
</header>

<script>
(function(){
  "use strict";
  var START_Y = 0; // 0 = image top-aligned at p=0 (head not cropped), 0.5 = centred
  var TOTAL = 240, WORKERS = 8, MAX_DPR = 1.5, SHIFT = 0.04, SHIFT_END = 0.33;
  var hero = document.getElementById("hero");
  var cv = document.getElementById("cv");
  var ctx = cv.getContext("2d", {alpha:false});
  var loaderEl = document.getElementById("loader");
  var root = document.documentElement;

  var frames = new Array(TOTAL);   // Image objects
  var ready  = new Uint8Array(TOTAL);
  var loaded = 0, settled = 0, loaderHidden = false;
  var W = 0, H = 0, dpr = 1;

  function src(i){ return "https://rustams060575-bot.github.io/de-frutos-judo/frames/f_" + String(i + 1).padStart(3, "0") + ".jpg"; }

  function hideLoader(){
    if (loaderHidden) return;
    loaderHidden = true;
    loaderEl.classList.add("done");
    root.classList.add("ready");
  }

  function load(i){
    return new Promise(function(res){
      var img = new Image();
      img.decoding = "async";
      img.onload = function(){
        var done = function(){ frames[i] = img; ready[i] = 1; loaded++; finish(); };
        if (img.decode) img.decode().then(done, done); else done();
      };
      img.onerror = function(){ finish(); };
      function finish(){
        settled++;
        if (loaded >= TOTAL * 0.15 || settled >= TOTAL) hideLoader();
        needDraw = true;
        res();
      }
      img.src = src(i);
    });
  }

  // priority order: every 8th, 4th, 2nd, then the rest (frame 0 is loaded first, separately)
  function buildQueue(){
    var seen = {0:1}, q = [];
    [8,4,2,1].forEach(function(step){
      for (var i = 0; i < TOTAL; i += step){ if (!seen[i]){ seen[i] = 1; q.push(i); } }
    });
    return q;
  }

  /* ---------- sizing & drawing ---------- */
  var current = 0, lastIdx = -1, lastP = -1, needDraw = true;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.imageSmoothingQuality = "high";
    needDraw = true;
  }

  function nearest(idx){
    if (ready[idx]) return frames[idx];
    for (var d = 1; d < TOTAL; d++){
      if (idx - d >= 0 && ready[idx - d]) return frames[idx - d];
      if (idx + d < TOTAL && ready[idx + d]) return frames[idx + d];
    }
    return null;
  }

  function ease(t){ return t * t * (3 - 2 * t); }

  function draw(idx, p){
    var img = nearest(idx);
    if (!img) return;
    var iw = img.naturalWidth, ih = img.naturalHeight;
    var maxShift = SHIFT * W;
    var shift = -maxShift * (1 - ease(Math.min(p / SHIFT_END, 1)));
    // cover (viewport + 2*|maxShift|) so the shifted image never exposes an edge
    var scale = Math.max((W + 2 * maxShift) / iw, H / ih);
    var dw = iw * scale, dh = ih * scale;
    var k = ease(Math.min(p / SHIFT_END, 1));
    var anchor = START_Y + (0.5 - START_Y) * k;
    var x = (W - dw) / 2 + shift, y = (H - dh) * anchor;
    ctx.drawImage(img, x, y, dw, dh);
  }

  /* ---------- UI state ---------- */
  var state = "";
  function setState(p){
    var s = p <= 0.06 ? "start" : (p >= 0.93 ? "finale" : "flight");
    if (s !== state){ state = s; hero.setAttribute("data-state", s); }
  }

  /* ---------- main loop ---------- */
  function tick(){
    var rect = hero.getBoundingClientRect();
    var span = hero.offsetHeight - window.innerHeight;
    var p = span > 0 ? Math.min(Math.max(-rect.top / span, 0), 1) : 0;
    setState(p);

    var target = p * (TOTAL - 1);
    current += (target - current) * 0.22;
    if (Math.abs(target - current) < 0.01) current = target;
    var idx = Math.round(current);

    if (needDraw || idx !== lastIdx || Math.abs(p - lastP) > 0.002){
      draw(idx, p);
      lastIdx = idx; lastP = p; needDraw = false;
    }
    requestAnimationFrame(tick);
  }

  // placeholder anchors should not jump the page
  document.addEventListener("click", function(e){
    var a = e.target.closest('a[href="#hero"]');
    if (a && !a.hasAttribute("data-menu")) e.preventDefault();
  });

  /* ---------- boot ---------- */
  window.addEventListener("resize", resize);
  resize();
  requestAnimationFrame(tick);

  load(0).then(function(){
    needDraw = true;
    var q = buildQueue(), pos = 0;
    function worker(){
      if (pos >= q.length) return;
      return load(q[pos++]).then(worker);
    }
    for (var w = 0; w < WORKERS; w++) worker();
  });
  // never leave the user stuck on the loader
  setTimeout(hideLoader, 15000);
})();
</script>
</body>
</html>
